version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rd_intel_postgres
    environment:
      POSTGRES_DB: rd_intel
      POSTGRES_USER: rd_intel_user
      POSTGRES_PASSWORD: rd_intel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rd_intel_user -d rd_intel"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
