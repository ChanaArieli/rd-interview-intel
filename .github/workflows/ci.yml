name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The API build and its tests need the generated Prisma client types.
      - run: pnpm --filter @rd-intel/api prisma:generate

      - run: pnpm build
      - run: pnpm lint
      # The web tests run in headless Chrome, which ships on ubuntu-latest.
      - run: pnpm test
